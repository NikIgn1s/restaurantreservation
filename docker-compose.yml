services:
  postgres:
    image: postgres:16
    container_name: reservation-postgres
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation -d reservation"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    container_name: reservation-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/reservation
      DB_USERNAME: reservation
      DB_PASSWORD: reservation
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/dev
      JWT_SECRET: docker-compose-secret-key-docker-compose-secret-key
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
