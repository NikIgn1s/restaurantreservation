services:
  postgres:
    image: postgres:16
    container_name: reservation-postgres
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: reservation
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation -d reservation"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: reservation-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ml-service:
    build: ./ml-service
    container_name: reservation-ml
    ports:
      - "${ML_PORT:-5002}:5001"
    restart: unless-stopped

  backend:
    build: .
    container_name: reservation-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/reservation
      DB_USERNAME: reservation
      DB_PASSWORD: reservation
      REDIS_HOST: redis
      ML_BASE_URL: http://ml-service:5001
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/dev
      JWT_SECRET: ${JWT_SECRET:-docker-compose-secret-key-docker-compose-secret-key}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
