spring:
  application:
    name: reservation
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservation}
    username: ${DB_USERNAME:reservation}
    password: ${DB_PASSWORD:reservation}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms

app:
  booking:
    pending-ttl: ${BOOKING_PENDING_TTL:PT30M}
    reminder-lead: ${BOOKING_REMINDER_LEAD:PT2H}
  risk:
    deposit-threshold: ${DEPOSIT_THRESHOLD:0.4}
    overbooking-enabled: ${OVERBOOKING_ENABLED:true}
    overbooking-min-probability: ${OVERBOOKING_MIN_PROBABILITY:0.5}
  ml:
    enabled: ${ML_ENABLED:true}
    base-url: ${ML_BASE_URL:http://localhost:5002}
    timeout: ${ML_TIMEOUT:PT1S}
    cooldown: ${ML_COOLDOWN:PT30S}
  payment:
    deposit-amount: ${DEPOSIT_AMOUNT:20.00}
    currency: ${PAYMENT_CURRENCY:PLN}
    fake-mode: ${PAYMENT_FAKE_MODE:approve}
  cache:
    enabled: ${CACHE_ENABLED:true}
    slots-ttl: ${SLOTS_CACHE_TTL:PT2M}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    expiration-interval: PT1M
    reminder-interval: PT1M
    initial-delay: PT30S
    min-lock: PT10S
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    ttl: ${JWT_TTL:PT1H}
    issuer: reservation

server:
  port: 8080
