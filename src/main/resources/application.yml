spring:
  application:
    name: reservation
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservation}
    username: ${DB_USERNAME:reservation}
    password: ${DB_PASSWORD:reservation}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  booking:
    pending-ttl: ${BOOKING_PENDING_TTL:PT30M}
    reminder-lead: ${BOOKING_REMINDER_LEAD:PT2H}
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    expiration-interval: PT1M
    reminder-interval: PT1M
    initial-delay: PT30S
    min-lock: PT10S
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    ttl: ${JWT_TTL:PT1H}
    issuer: reservation

server:
  port: 8080
